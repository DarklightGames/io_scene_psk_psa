name: tests

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  ADDON_NAME: io_scene_psk_psa
  # Shared libraries required by the `bpy` module.
  BPY_SYSTEM_DEPENDENCIES: libxxf86vm-dev libxfixes3 libxi-dev libxkbcommon-x11-0 libgl1 libglx-mesa0 libxrender1 libsm6

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Check formatting
        run: uv run --locked --only-group dev ruff format --check --diff .

  blender-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - name: Read supported Blender versions
        id: versions
        run: echo "versions=$(python3 tools/blender_versions.py)" >> "$GITHUB_OUTPUT"

  test:
    needs: blender-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        blender-version: ${{ fromJSON(needs.blender-versions.outputs.versions) }}
    name: test (Blender ${{ matrix.blender-version }})
    steps:
      - uses: actions/checkout@v4
      - name: Install bpy dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y $BPY_SYSTEM_DEPENDENCIES
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Run tests
        run: uv run --locked test ${{ matrix.blender-version }}

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bpy dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y $BPY_SYSTEM_DEPENDENCIES
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Build extension
        run: |
          mkdir -p dist
          uv run --locked tools/blender_extension.py build --source-dir ./${{ env.ADDON_NAME }} --output-filepath dist/${{ env.ADDON_NAME }}.zip
          unzip -q dist/${{ env.ADDON_NAME }}.zip -d dist/artifact
      - name: Archive addon
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ADDON_NAME }}-${{ github.ref_name }}-${{ github.sha }}
          path: |
            ./dist/artifact/*
